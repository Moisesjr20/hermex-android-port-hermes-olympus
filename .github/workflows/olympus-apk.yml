name: OLYMPUS APK Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - android/**
      - .github/workflows/olympus-apk.yml

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.HERMEX_ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/olympus-release.keystore
          echo "KEYSTORE_PATH=$RUNNER_TEMP/olympus-release.keystore" >> $GITHUB_ENV

      - name: Build Release APK (signed)
        working-directory: android
        env:
          HERMEX_ANDROID_KEYSTORE_FILE: ${{ env.KEYSTORE_PATH }}
          HERMEX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HERMEX_ANDROID_KEYSTORE_PASSWORD }}
          HERMEX_ANDROID_KEY_ALIAS: ${{ secrets.HERMEX_ANDROID_KEY_ALIAS }}
          HERMEX_ANDROID_KEY_PASSWORD: ${{ secrets.HERMEX_ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        working-directory: android
        run: |
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk \
             ../release/OLYMPUS-mobile-${{ github.sha }}.apk
          ls -lh ../release/

      - name: Verify signature
        working-directory: android
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -20

      - uses: actions/upload-artifact@v5
        with:
          name: olympus-mobile-release-apk
          path: release/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Cleanup keystore
        if: always()
        run: rm -f "$KEYSTORE_PATH" || true
