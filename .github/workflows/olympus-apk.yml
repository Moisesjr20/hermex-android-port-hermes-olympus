name: OLYMPUS APK Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - android/**
      - .github/workflows/olympus-apk.yml

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        working-directory: android
        run: |
          mkdir -p ../release
          cp app/build/outputs/apk/debug/app-debug.apk \
             ../release/OLYMPUS-mobile-debug-${{ github.sha }}.apk
          ls -lh ../release/
      - uses: actions/upload-artifact@v5
        with:
          name: olympus-mobile-debug-apk
          path: release/*.apk
          retention-days: 30
          if-no-files-found: error
